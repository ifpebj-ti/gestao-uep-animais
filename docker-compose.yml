version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.example

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - db
    env_file:
      - ./backend/.env.example

  data:
    build:
      context: ./data
    ports:
      - "${DATA_SERVICE_PORT:-5000}:5000"
    depends_on:
      - db
    env_file:
      - ./.env.example

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestao_uep}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
