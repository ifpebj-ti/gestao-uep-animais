services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.example
    environment:
      # Sobrepoe o API_URL do frontend/.env.example com o valor global (raiz),
      # se ele estiver definido, para nao ter dois lugares para editar.
      API_URL: ${API_URL:-http://localhost:3000}

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      - db
    env_file:
      # Só o que é exclusivo do backend (segredos/config que não fazem sentido
      # em outro serviço). Configuração compartilhada (banco, portas) vem do
      # .env.example da raiz via "environment" abaixo, para existir um único
      # lugar de verdade e não dessincronizar os dois arquivos.
      - ./backend/.env.example
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gestao_uep}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-changeme}
      BACKEND_PORT: ${BACKEND_PORT:-3000}

  data:
    build:
      context: ./data
    ports:
      - "${DATA_SERVICE_PORT:-5000}:5000"
    depends_on:
      - db
    env_file:
      - ./.env.example

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-gestao_uep}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  db_data:
