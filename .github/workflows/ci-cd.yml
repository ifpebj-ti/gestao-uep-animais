name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # 1. LINT — analise estatica de cada servico
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint backend (ESLint)
        working-directory: ./backend
        run: |
          npm install
          npx eslint src --max-warnings=0

      - name: Lint data (flake8)
        working-directory: ./data
        run: |
          pip install -r requirements-dev.txt --break-system-packages
          flake8 scripts/ --max-line-length=100

      - name: Lint frontend (HTMLHint + Stylelint)
        working-directory: ./frontend
        run: |
          npm install
          npm run lint:html
          npm run lint:css

  # 2. BUILD — validacao de que cada servico "compila"/monta sem erros
  build:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build backend (verificacao de sintaxe de todos os modulos)
        working-directory: ./backend
        run: |
          npm install
          find src -name "*.js" -exec node --check {} \;

      - name: Build data (compilacao para bytecode)
        working-directory: ./data
        run: |
          pip install -r requirements.txt --break-system-packages
          python -m py_compile scripts/*.py

      - name: Build frontend (validacao estrutural)
        working-directory: ./frontend
        run: |
          test -f src/index.html
          echo "Frontend OK - index.html presente"

  # 3. TESTES — testes automatizados principais
  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testes unitarios do backend
        working-directory: ./backend
        run: |
          npm install
          npm test

      - name: Testes do servico de dados
        working-directory: ./data
        run: |
          pip install -r requirements-dev.txt --break-system-packages
          pytest test/ -v

  # 4. AUTOMACAO DE MIGRACOES — roda as migrations reais contra um Postgres
  #    de servico e valida com o smoke test ja existente (auth, RBAC, UEPs,
  #    censo de animais). Pega migration quebrada ANTES do merge, nao so
  #    quando o container sobe em producao.
  migrate:
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gestao_uep
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./backend
        run: npm install

      - name: Rodar migracoes contra Postgres do CI
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gestao_uep
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: npm run migrate

      - name: Rodar migracoes de novo (checagem de idempotencia)
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gestao_uep
          DB_USER: postgres
          DB_PASSWORD: postgres
        run: npm run migrate

      - name: Subir a API e validar com o smoke test
        working-directory: ./backend
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gestao_uep
          DB_USER: postgres
          DB_PASSWORD: postgres
          BACKEND_PORT: 3000
        run: |
          node src/index.js &
          BACKEND_PID=$!
          sleep 2
          API_BASE=http://localhost:3000/api \
            SEED_ADMIN_EMAIL=admin@ifpe.edu.br \
            SEED_ADMIN_PASSWORD=admin123 \
            node scripts/smoke.js
          EXIT=$?
          kill $BACKEND_PID
          exit $EXIT

  # 5 e 6. BUILD DA IMAGEM + ANALISE (Trivy) + PUBLICACAO NO REGISTRY (GHCR)
  docker:
    needs: [test, migrate]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, data]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags da imagem no GHCR (docker/metadata-action):
      #   release v0.1.0 (git tag) -> :0.1.0, :0.1 e :latest
      #   push na main              -> :main e :sha-<7 chars>
      #   pull request              -> :pr-<numero> (so build + Trivy, nao publica)
      # A tag de release TEM que seguir o formato vX.Y.Z (ex.: v0.1.0) pra
      # virar versao; tag fora desse padrao nao gera imagem versionada.
      - name: Definir tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build da imagem
        run: |
          docker build \
            $(echo "${{ steps.meta.outputs.tags }}" | sed 's/^/-t /') \
            ./${{ matrix.service }}

      - name: Analise de vulnerabilidades (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ steps.meta.outputs.version }}
          severity: "CRITICAL"
          exit-code: "1"

      - name: Publicar imagem no registry
        if: github.event_name == 'push'
        run: |
          docker push --all-tags ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}